  <rect fill="#23201b" x="0" y="7.5"  width="43" height="3.5" rx="1.75"/>
  <rect fill="#23201b" x="0" y="15"   width="43" height="3.5" rx="1.75"/>
  <rect fill="#23201b" x="0" y="22.5" width="26" height="3.5" rx="1.75"/>
  <rect fill="#23201b" x="0"  y="30" width="13" height="13" rx="2.5"/>
  <rect fill="#23201b" x="15" y="30" width="13" height="13" rx="2.5"/>
  <rect x="30" y="30" width="13" height="13" rx="2.5" fill="#b6a2e4"/>
</svg>
