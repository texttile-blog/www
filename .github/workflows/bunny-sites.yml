name: Deploy website to Bunny

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bunny-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect public files
        run: make site
      - name: Deploy website
        uses: BunnyWay/actions/deploy-site@4b22fe0b319386b3913117daf97729409dd0a6ef # deploy-site_0.1.1
        with:
          site: texttile-www
          directory: .site
          cli_version: "0.19.0"
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
      - name: Clean up old deployments
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: npx --yes @bunny.net/cli@0.19.0 sites deployments prune texttile-www --keep 3 --force
